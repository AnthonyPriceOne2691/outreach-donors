# Ход агента продаж: что он делает в ситуации письма собеседника.
#
# Здесь только ситуации, где ответ нужен. «Спасибо, получил» и автоответ —
# без ответа, сбой разбора — человеку: это решает код брифа до таблицы
# (`situation.reply_needed`), а не строка здесь.
#
# kinds — виды записей базы под ход сверх `always`; cta — куда позвать, по
# порядку: берётся первая ссылка, заданная в настройках отправителя; пусто —
# ход без призыва. lead — разговор становится лидом (передача лида — Ф5).
# Правка таблицы меняет поведение агента: поднимите version — по ней
# калибровка сравнивает черновики.

version = "sales-moves-v1"
# Записи под каждое письмо: кто мы и чего не писать никогда.
always = ["brief", "forbidden"]
# Виды, которые сужаются до тегов письма, если теги названы и нашлись.
by_tags = ["service", "case", "objection"]

[situations.asks_price]
move = "price"
does = "Ответить о цене по политике цен из базы. Сумм в ней нет — цену не называть и предложить созвон."
kinds = ["price_policy", "cta"]
cta = ["call", "telegram"]

[situations.asks_info]
move = "inform"
does = "Ответить на вопрос фактами об услугах и кейсах из базы и предложить один следующий шаг."
kinds = ["service", "case", "cta"]
cta = ["call", "telegram"]

[situations.objection]
move = "objection"
does = "Ответить на возражение по записи возражений из базы, без давления, и предложить один следующий шаг."
kinds = ["objection", "case", "cta"]
cta = ["call", "telegram"]

[situations.wants_to_talk]
move = "talk"
does = "Собеседник готов говорить: дать ссылку на Telegram или созвон из настроек. Разговор — лид."
kinds = ["cta"]
cta = ["telegram", "call"]
lead = true

[situations.not_now]
move = "close"
does = "Вежливо закрыть без давления: поблагодарить, ничего не предлагать и никуда не звать."
cta = []

[situations.refusal]
move = "close"
does = "Коротко поблагодарить и закрыть: без уговоров, предложений и призыва."
cta = []

[situations.wrong_person]
move = "redirect"
does = "Поблагодарить и спросить, кто у них занимается этим вопросом; без ссылок и призыва."
cta = []
