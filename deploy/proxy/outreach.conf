# Обратный прокси хоста: два поддомена, один сертификат.
#
# Это единственный, кто занимает 80 и 443 на машине. Оба проекта
# слушают петлю (`127.0.0.1`) и наружу не смотрят: иначе сервис
# доступен мимо TLS и мимо общего сертификата, а заметить это можно
# только чужим запросом по http.
#
# Ставится так:
#   sudo cp deploy/proxy/outreach.conf /etc/nginx/sites-available/outreach
#   sudo ln -s /etc/nginx/sites-available/outreach /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d outreach.ПРИМЕР.ru -d cases.ПРИМЕР.ru
#   sudo nginx -t && sudo systemctl reload nginx
#
# certbot сам допишет сюда `listen 443 ssl`, пути к сертификату и
# перенаправление с http. Отдельного крона продления не нужно: пакет
# ставит системный таймер — проверить его `systemctl list-timers | grep certbot`.
#
# ⚠ Имена поддоменов — заглушки. Настоящие подставляются при выкатке,
# и коммитить их сюда незачем: репозиторий публичный.

# Потолок частоты входа — до сервера, на адрес клиента. Счётчик в самом
# сервере тоже есть, но он в памяти процесса; этот держит и перебор,
# размазанный по многим учёткам. Зона объявляется здесь: файл из
# sites-enabled включается внутрь блока http.
limit_req_zone $binary_remote_addr zone=outreach_login:10m rate=10r/m;

# Журнал без строки запроса: в ней бывают метки отписки и прочее, чему
# в логах не место (docs/SECURITY.md). Путь без параметров, метод, код.
log_format outreach_safe '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent $request_time';

# Задача №2 — сервис поиска доноров и сбора цен.
server {
    listen 80;
    server_name outreach.ПРИМЕР.ru;

    client_max_body_size 8m;
    access_log /var/log/nginx/outreach.access.log outreach_safe;
    server_tokens off;

    # HSTS: браузер, раз побывав здесь, больше не пойдёт по http — пароль
    # прокси и пропуск не уйдут открытым текстом в чужой Wi-Fi. certbot
    # переносит этот блок в 443, так что строка оказывается где нужно.
    # Без includeSubDomains: на машине несколько сервисов на поддоменах,
    # и чужой, ещё без сертификата, это заперло бы.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ⚠ Адрес клиента ПЕРЕЗАПИСЫВАЕТСЯ, а не дописывается. При
    # `$proxy_add_x_forwarded_for` клиент присылает свой X-Forwarded-For,
    # сервер берёт из цепочки самый левый адрес — то есть подставленный
    # клиентом, — и счётчик попыток входа обходится сменой заголовка
    # (проверено 24.09: 12 неудачных входов с разными адресами — ни одного
    # отказа). Здесь первый и единственный, кто видит настоящий адрес.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    # Прогон и поиск контактов идут минутами.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Весь сервис — за паролем прокси (docs/SECURITY.md): экран, схема API и само API.
    # Посторонний не видит ни экрана входа, ни ручек, а перебирать пароли учёток ему
    # не к чему. Пароль стоит на уровне server: новый адрес закрыт сам, открывают
    # его явно (`auth_basic off`), а не забывают закрыть.
    # Файл паролей: sudo htpasswd -c /etc/nginx/outreach.htpasswd команда
    #
    # API за паролем с 11.10.2026: до того пропуск сервиса шёл `Authorization: Bearer`,
    # и пароль прокси на том же заголовке отказал бы каждому запросу, — при публичном коде
    # вход в API был единственным замком перед данными. Теперь пропуск идёт своим
    # заголовком (`X-Access-Token`), а `Authorization` несёт пароль прокси: браузер шлёт
    # его сам, раз человек ввёл его на входе в экран.
    auth_basic "Parsing and Prices";
    auth_basic_user_file /etc/nginx/outreach.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8090;
    }

    # API — своим местом: потолок тела загрузки сверяет tests/test_thread_files_api.py.
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
    }

    location = /api/auth/login {
        limit_req zone=outreach_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
    }

    # Без пароля прокси — только адреса, куда ходят не люди команды. У каждого своя защита.
    #
    # Ответы доноров приходят вебхуком с вложениями: потолок тот же, что
    # у сервера (30 МБ, `api/inbound/routes.py`), иначе письмо с файлом
    # отбивается прокси, а платформа повторяет его без конца. Секрет вебхука
    # приходит паролем Basic в том же `Authorization` — заголовок не трогать.
    location /api/inbound/ {
        auth_basic off;
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:8090;
    }

    # События доставки: платформа подписывает каждое (`api/events/routes.py`).
    location /api/events/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8090;
    }

    # Отписка: ссылка в письме и «отписаться одним нажатием» почтовика — получателю
    # пароль прокси не нужен, метка отписки в самой ссылке.
    location /api/unsubscribe/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8090;
    }
}

# Соседняя система на той же машине. Её контейнер уже слушает 8080;
# от неё требуется только одно — перестать публиковать порт наружу.
server {
    listen 80;
    server_name cases.ПРИМЕР.ru;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
