# Фронт и обратный прокси к серверу.
#
# Одно происхождение для браузера: и страница, и `/api` приходят с одного
# адреса. Поэтому нет ни CORS, ни разговоров про куки между доменами —
# их отсутствие здесь не упущение, а следствие раскладки.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Версия nginx в заголовках и на страницах ошибок — подсказка перебору.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Тело запроса: письма с вложениями придут во второй фазе, а пока
    # потолок нужен, чтобы отказ был внятным и ранним.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ответы доноров с вложениями: потолок сервера — 30 МБ.
    location /api/inbound/ {
        client_max_body_size 30m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Настоящий адрес клиента. Без него счётчик попыток входа видит
        # один и тот же адрес прокси и закрывает вход всем сразу после
        # первого же перебора.
        proxy_set_header X-Real-IP $remote_addr;
        # Адрес клиента уже записан прокси хоста (`proxy/outreach.conf`)
        # и передаётся как есть: дописывать к нему адрес прокси незачем,
        # а дописанный клиентом — опасно.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Прогон и поиск контактов идут минутами: умолчание в минуту
        # обрывало бы запрос «без ответа».
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Собранные файлы несут хеш в имени и не меняются никогда.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Одностраничное приложение: любой путь отдаёт index.html, иначе
    # обновление страницы на /users даёт 404 от nginx, а не экран.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # index.html перепроверяется при каждом заходе. Иначе браузер держит
        # старый после выкатки, а тот ссылается на файлы сборки, которых
        # в новом образе уже нет, — белый экран до жёсткого обновления.
        add_header Cache-Control "no-cache" always;
        # Страница берёт скрипты, стили и данные только со своего адреса.
        # Главное, от чего это: пропуск лежит в localStorage, и чужой
        # скрипт, попавший на страницу, унёс бы его. Встроенный скрипт
        # темы в index.html разрешён по хешу содержимого — правка скрипта
        # требует нового хеша, это сторожит `tests/test_deploy_headers.py`.
        # Стили — с 'unsafe-inline': Mantine ставит переменные темы тегом
        # <style> и пишет стили в атрибуты, а стили скриптом не исполняются.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-II5F/q4jI3zI9g9/17tVWddqwse6H5qdSUB46UEQ1Rg='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
