# Заголовки безопасности — одни на все ответы сервиса.
#
# Подключается `include` на уровне server И в каждом location, где есть
# свой add_header: nginx наследует add_header сверху, только пока у блока
# нет ни одного своего. Забытый include молча снимает все заголовки с этого
# адреса — поэтому это проверяет тест `tests/test_deploy_headers.py`.
#
# `always` — чтобы заголовки стояли и на ответах 4xx/5xx.

# Браузер не угадывает тип файла: скрипт, пришедший как текст, не исполнится.
add_header X-Content-Type-Options "nosniff" always;
# Сервис не встраивается в чужие страницы — от подставных кнопок поверх него.
add_header X-Frame-Options "DENY" always;
# Адрес сервиса не уходит сайтам доноров, которые открывают из интерфейса.
add_header Referrer-Policy "no-referrer" always;
# Камера, микрофон, геопозиция, оплата сервису не нужны — запрещены совсем.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
