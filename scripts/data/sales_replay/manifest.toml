# Наборы прогона агента продаж на входящих с известным исходом (scripts/sales_replay.py).
#
# Набор из настоящих писем живёт ВНЕ репозитория: репозиторий публичный. Здесь — что в
# наборе должно лежать: файлы, сколько случаев не меньше, контрольные суммы. Каталог
# внешних наборов — переменная SALES_REPLAY_DIR (или --dir у команды). Набора нет по пути —
# прогон отказывает словами «набор не найден», пуст или мал — тоже отказ, а не «0 расхождений».
#
# Строка файла набора — один случай JSON:
#   {"id": "…",
#    "turns": [{"from": "us", "text": "…"}, {"from": "them", "text": "…"}],
#    "human": {"decision": "sent_as_is" | "sent_edited" | "own" | "rejected" | "silent",
#              "replied": true | false,
#              "situation": "asks_price" | "asks_info" | … ,
#              "reason": "…"}}
# - turns — переписка по порядку, последним — письмо собеседника, на которое отвечают;
# - decision — что сделал человек: отправил черновик как есть, с правкой, ответил сам,
#   отклонил, промолчал;
# - replied — ответил ли человек письмом; нужен только у rejected, у остальных следует
#   из решения;
# - situation — метка ситуации человеком, эталон для сравнения меток; можно не ставить;
# - reason — почему отклонил.
# Адреса, имена, ссылки и суммы заменяются метками или выдуманными значениями до выгрузки.

format = "sales-replay-set-v1"

[sets.crm]
# Ответы холодной рассылки из резервной копии CRM, обезличенные; её метки переведены в
# метки агента продаж. Кладёт в $SALES_REPLAY_DIR/crm/ тот, кто выгрузил.
files = ["crm/cases.jsonl"]
min_cases = 100

[sets.crm.sha256]
# "crm/cases.jsonl" = "<sha256 файла>" — вписать после выгрузки; не вписано — не сверяется.

[sets.synthetic]
# Маленький выдуманный набор в репозитории: на нём тесты проверяют прогон и ворота.
dir = "synthetic"
files = ["cases.jsonl"]
min_cases = 6
