name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Тесты репозитория идут на настоящей базе: проверять запрос к базе
    # на подделке значит проверять подделку.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_STORAGE_DSN: postgresql+asyncpg://outreach:outreach@localhost:5432/outreach_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check backend/ tests/ scripts/

      - name: Форматирование
        run: ruff format --check backend/ tests/ scripts/

      - name: Типы
        run: mypy backend/

      - name: Архитектурные гейты
        run: python scripts/gates.py

      - name: Ратчет сложности
        run: python scripts/complexity.py

      - name: Тесты
        run: pytest

  # Фронт проверяется отдельной работой: он не зависит ни от базы, ни от
  # питона, и держать его в одной работе значит ждать поднятия постгреса
  # ради проверки типов в TypeScript.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Форматирование
        run: npm run format:check

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
