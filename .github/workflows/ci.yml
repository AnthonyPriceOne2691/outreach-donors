name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Тесты репозитория идут на настоящей базе: проверять запрос к базе
    # на подделке значит проверять подделку.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_STORAGE_DSN: postgresql+asyncpg://outreach:outreach@localhost:5432/outreach_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check backend/ tests/ scripts/

      - name: Форматирование
        run: ruff format --check backend/ tests/ scripts/

      - name: Типы
        run: mypy backend/

      - name: Архитектурные гейты
        run: python scripts/gates.py

      # §3.4a. Необратимое без человека в цепочке требует подписи оператора.
      # Сверяется ИСПОЛНЕНИЕМ: подпись, которую никто не проверил, неотличима
      # от подделанной. Шаг обязан жить в CI, а не только в хуке: локальную
      # проверку агент обходит флагом, серверную — нет.
      - name: Подпись необратимого
        run: bash scripts/check_irreversible_signature.sh

      - name: Ратчет сложности
        run: python scripts/complexity.py

      - name: Тесты
        run: pytest

  # Фронт проверяется отдельной работой: он не зависит ни от базы, ни от
  # питона, и держать его в одной работе значит ждать поднятия постгреса
  # ради проверки типов в TypeScript.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Форматирование
        run: npm run format:check

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

  # Образы собираются в CI по той же причине, по которой тесты гоняются
  # там же: сломанный Dockerfile иначе обнаруживается при развёртывании,
  # когда чинить его некогда. Контейнеры здесь не запускаются — это
  # проверка сборки, а не работы.
  docker:
    runs-on: ubuntu-latest

    # Образы уезжают в реестр той же работой, что их собирает: собранный
    # и не опубликованный образ — это сборка на сервере, а она берёт
    # 2–3 ГБ памяти рядом с работающей соседней системой.
    permissions:
      contents: read
      packages: write

    # База нужна одному шагу — прогону миграций тем же образом, каким они
    # пойдут на сервере. Тесты её не используют: у них своя работа.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_fresh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Образ сервера и воркера
        run: docker build --target backend -t outreach-backend:ci .

      - name: Образ фронта
        run: docker build --target web -t outreach-web:ci .

      - name: Консольная команда внутри образа находит свой код
        # Ловит ровно тот дефект, который нашёлся живым запуском 19.09.2026:
        # пустышка пакета в site-packages перекрывала настоящий код, и
        # `outreach user-add` внутри контейнера падал на импорте.
        run: docker run --rm outreach-backend:ci outreach --help

      - name: Миграции на чистой базе — тем же образом, что и на сервере
        # Набор тестов гоняет alembic из рабочей копии; на сервере его
        # гоняет контейнер `migrate` из образа. Разница между ними —
        # это ровно то, что ломает первое развёртывание: не уехавший
        # в образ файл миграции или недостающая зависимость.
        run: |
          docker run --rm --network host \
            -e STORAGE_DSN="postgresql+asyncpg://outreach:outreach@127.0.0.1:5432/outreach_fresh" \
            outreach-backend:ci alembic upgrade head

      - name: Войти в реестр
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Опубликовать образы
        # Только со слитого в main: образ из ветки, которую никто
        # не принял, на сервере не нужен, а метка `main` обязана
        # означать то, что в main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/outreach-donors"
          for pair in "backend:$repo-backend" "web:$repo-web"; do
            local_image="outreach-${pair%%:*}:ci"
            remote="${pair#*:}"
            docker tag "$local_image" "$remote:${{ github.sha }}"
            docker tag "$local_image" "$remote:main"
            docker push "$remote:${{ github.sha }}"
            docker push "$remote:main"
          done
