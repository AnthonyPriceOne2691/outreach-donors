name: CI

on:
  push:
    branches: [main]
  pull_request:

# Токен джоб — только на чтение кода (аудит 19.11.2026): без строки ниже он получал
# права репозитория по умолчанию. Публикации образов нужно больше — права у джобы
# `docker` свои, и они заменяют эти целиком.
permissions:
  contents: read

# Действия — по полному коммиту, версия — комментарием (аудит 20.11.2026, п. 34):
# метку вроде `v4` владелец действия может передвинуть на любой коммит, и следующий
# прогон исполнит его с токеном джобы — так 19.03.2026 подменили метки trivy-action.
# Коммиты сняты с меток официальных репозиториев и совпадают с тем, куда метки
# указывали в день закрепления, — поведение прежнее. Поднимает их Dependabot
# (.github/dependabot.yml), держит форму tests/test_ci_supply_chain.py.

jobs:
  check:
    runs-on: ubuntu-latest

    # Тесты репозитория идут на настоящей базе: проверять запрос к базе
    # на подделке значит проверять подделку.
    # Официальный образ Docker — с зеркала Google (`mirror.gcr.io`), а не с Docker Hub:
    # анонимные скачивания с Hub делят лимит по IP со всеми машинами GitHub, и
    # 09.10.2026 ~23:56 МСК «toomanyrequests» уронил сборку образа трижды подряд.
    # ECR Public, куда ушли тогда, 13.10.2026 трижды за день отказал тем же
    # «toomanyrequests: Data limit exceeded» — у анонимных скачиваний и там свой лимит.
    # Образ тот же — Docker сам выкладывает официальные образы в `docker/library`.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_STORAGE_DSN: postgresql+asyncpg://outreach:outreach@localhost:5432/outreach_test

    steps:
      # Полная история: проверке волн нужна база PR и общий предок с ней —
      # на глубине 1 `base...HEAD` не считается.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # uv той же версии, что ставит зависимости в образ (`Dockerfile`,
      # `FROM ghcr.io/astral-sh/uv:… AS uv`): lock-файл сверяется и ставится
      # одним инструментом. Совпадение держит tests/test_python_lock.py.
      # Действие закреплено коммитом: метку можно передвинуть, коммит — нет.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"

      # Отдельным шагом, чтобы красное называлось причиной. Правка
      # pyproject.toml без `uv lock` иначе разошлась бы с lock-файлом молча:
      # тесты шли бы на старых версиях, а новый диапазон не проверял никто.
      - name: Lock-файл совпадает с pyproject
        run: uv lock --check

      # Ровно версии из uv.lock — те же, что уедут в образ. Раньше здесь
      # стоял `pip install` по диапазонам, и 25.09.2026 CI покраснел не от
      # правки, а от чужого релиза: сам поставил только что вышедшую
      # SQLAlchemy 2.1.0. `.venv/bin` в PATH — чтобы шаги ниже звали ruff,
      # mypy и pytest оттуда.
      - name: Установить зависимости
        run: |
          uv sync --frozen --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Линтер
        run: ruff check backend/ tests/ scripts/

      - name: Форматирование
        run: ruff format --check backend/ tests/ scripts/

      - name: Типы
        run: mypy backend/

      # На PR гейт судит и то, что уйдёт в main вместе с кодом: сообщения коммитов
      # PR (`--commits`) и заголовок с телом PR (`--pr-env`) — из них GitHub
      # собирает squash-коммит. Текст PR — только через `env:`: подстановка
      # выражения в `run:` исполнила бы заголовок как код. Правку текста после
      # прогона судит pr-text.yml. База — ветка назначения, как у проверки волн
      # ниже. На push в main сообщение последнего коммита уже опубликовано (его
      # задают руками при слиянии) — о нём только предупреждение, код 0.
      - name: Архитектурные гейты
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            python scripts/gates.py --commits "origin/$GITHUB_BASE_REF" --pr-env
          else
            python scripts/gates.py --commits-warn HEAD^
          fi

      # §3.4a. Необратимое без человека в цепочке требует подписи оператора.
      # Сверяется ИСПОЛНЕНИЕМ: подпись, которую никто не проверил, неотличима
      # от подделанной. Шаг обязан жить в CI, а не только в хуке: локальную
      # проверку агент обходит флагом, серверную — нет.
      - name: Подпись необратимого
        run: bash scripts/check_irreversible_signature.sh

      # Волны контура модуля «Продажи»: срез продаж с пропущенной волной не уходит
      # в main. Шаг здесь, потому что мерж держит только обязательная проверка:
      # `quality` не обязательна, а merge_guard обходится через `gh pr merge`.
      # Без файлов sales/ шаг зелёный и говорит это словами; PR доноров не краснит.
      # На pre-push та же проверка — только предупреждение (scripts/hooks/pre-push).
      #
      # База диффа — лестница шага «Diff base» из quality.yml без тихой ступени:
      # PR — ветка назначения; push в main — состояние до толчка; нулевой или
      # недостижимый `before` — отказ вслух. Фолбэк на HEAD дал бы пустой дифф и
      # зелёное «проверено» над пустотой (урок cqg@2.34).
      - name: Волны контура модуля «Продажи»
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            echo "::error::база диффа не определима (before=${BEFORE:-пусто}): первый push или переписанная история — проверка волн не судит пустоту"
            exit 1
          fi
          echo "база диффа: $base"
          python scripts/contour_waves.py --base "$base"

      - name: Ратчет сложности
        run: python scripts/complexity.py

      # Сьют в обязательной проверке идёт ГОЛЫМ. Покрытие с `concurrency =
      # greenlet` (без него coverage слеп к async-коду, а ядро sysmon гринлеты не
      # держит) стоило ей +200–290 с на каждом backend-PR: «Тесты» 530/532/561/608 с
      # без покрытия против 801/822 с с ним (замер 07.10, #180/#194/#196). При
      # `strict` и слиянии по одному это минуты на каждый PR очереди. Покрытие —
      # в джобе `coverage` ниже, параллельно и необязательно.
      #
      # В четыре процесса — по числу ядер раннера публичного репозитория. Замер
      # 12.10.2026 на #326: тесты — 17 минут из 18 у check и 30 из 30 у coverage,
      # остальные шаги вместе — меньше минуты, и каждая выкатка ждала CI часами.
      # База у каждого процесса своя (`worker_dsn`, tests/conftest.py): с общей
      # первый же процесс снёс бы схему под остальными. `--dist loadfile` — файл
      # целиком в одном процессе, порядок тестов внутри файла прежний.
      - name: Тесты
        run: pytest -n 4 --dist loadfile

  # Покрытие изменённого кода — отдельной необязательной джобой, ПАРАЛЛЕЛЬНО
  # check: обязательный путь не ждёт трассировку. Сьют на backend-PR идёт дважды —
  # это место в очереди раннеров, а не деньги (репозиторий публичный), и скорость
  # слияний важнее (решение 07.10). Нет правок python в backend — сьют здесь не
  # гоняется, джоба кладёт только привязку `coverage.json.head`.
  #
  # Покрытие снимается с КАТАЛОГОВ изменённых файлов, а не с имён модулей — по
  # двум независимым причинам (#196):
  # 1. Имя модуля coverage ищет через find_spec ещё до первого теста, и тот
  #    импортирует родительский пакет: `backend.features.core.models.donor`
  #    тянет все модели и SQLAlchemy до старта трассировки, после чего процесс
  #    падает segfault на первом подключении к базе (#194: в CI 1 из 1,
  #    локально 3 из 3; каталогом — 3 из 3 зелёные). Так же — `features/sales`.
  # 2. По имени coverage не видит файл, загруженный по пути: ревизии миграций
  #    (`tests/migration_helpers.py`, spec_from_file_location) выпадали из
  #    отчёта, и гейт краснел «не исполнялся тестами вовсе».
  # Соседние файлы каталога в отчёте гейту не мешают: он судит изменённые
  # файлы целиком (`percent_covered` файла), а не строки диффа. Привязка
  # `coverage.json.head` — SHA, на котором шёл сьют: гейт откажется судить
  # отчёт чужого коммита.
  coverage:
    runs-on: ubuntu-latest
    # 11.10.2026: сьют под покрытием шёл 29:23 (7021 тест), и лимит в 30 минут обрывал
    # джобу уже после тестов — на записи отчёта; diff-coverage тогда пропускался.
    timeout-minutes: 45

    # Образ — с зеркала, как у `check`.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_STORAGE_DSN: postgresql+asyncpg://outreach:outreach@localhost:5432/outreach_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Та же версия uv и тот же lock, что в check: покрытие снимается с того же
      # окружения, на котором check судит тесты.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"

      - name: Установить зависимости
        run: |
          uv sync --frozen --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Тесты с покрытием изменённых каталогов
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          dirs=""
          if [ -n "$base" ]; then
            dirs=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- 'backend/*.py' \
              | xargs -r -n1 dirname | sort -u)
          fi
          # Четыре процесса, как у check: pytest-cov снимает покрытие с каждого
          # и сводит в один отчёт.
          if [ -n "$dirs" ]; then
            echo "покрытие каталогов изменённых файлов: $(echo $dirs)"
            pytest -n 4 --dist loadfile $(printf -- '--cov=%s ' $dirs) --cov-report=json:coverage.json
          else
            echo "правок python в backend нет — сьют здесь не гоняется, судить нечего"
          fi
          git rev-parse HEAD > coverage.json.head

      - name: Отчёт покрытия для гейта
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage.json
            coverage.json.head
          retention-days: 3

  # Гейт покрытия изменённого кода (контур, scripts/lint/check_diff_coverage.sh)
  # читает отчёт джобы coverage и сьют не гоняет. Как и coverage, не блокирующий:
  # обязательная проверка у проекта — check. Без базы и питона проекта — только
  # git и python3.
  diff-coverage:
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STRICT: "1"
      MIN_PCT: "70"
      LINT_PY_SRC: backend
      LINT_BE_DIR: "."
      LINT_COV_PKG: backend
      LINT_COV_FILE: coverage.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage

      # Лестница базы та же, что у шага волн и «Diff base» в quality.yml: PR — ветка
      # назначения; push в main — состояние до толчка; иначе отказ вслух.
      - name: Покрытие изменённого кода
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            echo "::error::база диффа не определима (before=${BEFORE:-пусто}): гейт покрытия не судит пустоту"
            exit 1
          fi
          echo "база диффа: $base"
          BASE="$base" bash scripts/lint/check_diff_coverage.sh

  # Фронт проверяется отдельной работой: он не зависит ни от базы, ни от
  # питона, и держать его в одной работе значит ждать поднятия постгреса
  # ради проверки типов в TypeScript.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Форматирование
        run: npm run format:check

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

  # Образы собираются в CI по той же причине, по которой тесты гоняются
  # там же: сломанный Dockerfile иначе обнаруживается при развёртывании,
  # когда чинить его некогда. Контейнеры здесь не запускаются — это
  # проверка сборки, а не работы.
  docker:
    runs-on: ubuntu-latest
    # Публикуется только проверенное: метка `main` — это то, что сервер
    # стянет при следующем обновлении, и образ с красными тестами уехал
    # бы на прод ровно так же, как зелёный.
    needs: [check, web]

    # Образы уезжают в реестр той же работой, что их собирает: собранный
    # и не опубликованный образ — это сборка на сервере, а она берёт
    # 2–3 ГБ памяти рядом с работающей соседней системой.
    permissions:
      contents: read
      packages: write

    # База нужна одному шагу — прогону миграций тем же образом, каким они
    # пойдут на сервере. Тесты её не используют: у них своя работа.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine  # с зеркала, как у `check`
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_fresh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Токен джобы — с правом публиковать образы — не остаётся в .git/config: за
      # checkout здесь идут сторонние действия (сканер), читать его им незачем, а
      # git после checkout этой джобе не нужен (аудит 20.11.2026).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Образ сервера и воркера
        run: docker build --target backend -t outreach-backend:ci .

      - name: Образ фронта
        run: docker build --target web -t outreach-web:ci .

      - name: Консольная команда внутри образа находит свой код
        # Ловит ровно тот дефект, который нашёлся живым запуском 19.09.2026:
        # пустышка пакета в site-packages перекрывала настоящий код, и
        # `outreach user-add` внутри контейнера падал на импорте.
        run: docker run --rm outreach-backend:ci outreach --help

      - name: Шаблоны писем и промпты — внутри образа
        # 29.09.2026 колесо проекта ушло в образ без не-питоновых файлов,
        # и консольная команда (`outreach mail-test`, `letters-build`) не
        # находила шаблона письма. Сервер и воркеры этого не видели: они
        # запускаются из /app и берут код оттуда, а консоль — из
        # site-packages. Поэтому проверка идёт из чужого каталога и сначала
        # убеждается, что читает установленную копию: из /app она прошла бы
        # и на сломанном образе.
        run: |
          docker run --rm -i -w /tmp outreach-backend:ci python - <<'EOF'
          import backend
          assert "site-packages" in backend.__file__, backend.__file__
          import typing
          from backend.features.core import stages
          from backend.features.keywords import angles
          from backend.features.letters import template
          # Шаблоны в колесе — у этапов с почтой (`MailStage`). Шаблоны продаж
          # живут в базе, а почта продажам пока отказывает словами.
          for stage in typing.get_args(stages.MailStage):
              template.for_stage(stage)
              for step in (1, 2):
                  template.followup(step, stage)
          for name in ("guides", "news", "reviews", "topics"):
              angles.load_prompt(name)
          from backend.features.agent import writer
          from backend.features.agent.stages import AGENT_STAGES
          for parts in AGENT_STAGES.values():
              writer.load_prompt(parts.prompt)
          # Судья, переписывание и разбор ответа читают промпт при импорте:
          # без файла в колесе падает уже импорт.
          from backend.features.donors import publisher_judge
          from backend.features.letters import rewrite
          from backend.features.replies import extract
          for prompt in (publisher_judge.SYSTEM, publisher_judge.ARBITER_SYSTEM, rewrite.SYSTEM, extract.SYSTEM):
              assert prompt, "пустой промпт"
          from backend.features.crawl import judge_client
          judge_client.load_prompt()
          judge_client.load_again()
          from backend.features.sales import reply_kind
          reply_kind.load_prompt()
          from backend.features.sales.agent import judge, moves, parts, situation
          writer.load_prompt(parts.PROMPT)  # черновик продаж: в реестре — только по тумблеру
          writer.load_prompt(situation.PROMPT)
          writer.load_prompt(judge.PROMPT)
          moves.table()  # таблица ходов продаж: данными, проверяется при чтении
          print("шаблоны писем и промпты читаются из", backend.__file__)
          EOF

      - name: Миграции на чистой базе — тем же образом, что и на сервере
        # Набор тестов гоняет alembic из рабочей копии; на сервере его
        # гоняет контейнер `migrate` из образа. Разница между ними —
        # это ровно то, что ломает первое развёртывание: не уехавший
        # в образ файл миграции или недостающая зависимость.
        run: |
          docker run --rm --network host \
            -e STORAGE_DSN="postgresql+asyncpg://outreach:outreach@127.0.0.1:5432/outreach_fresh" \
            outreach-backend:ci alembic upgrade head

      # --- Скан образов и SBOM (аудит 20.11.2026, п. 36) ------------------------
      # Trivy через aquasecurity/trivy-action — коммитом неизменяемого релиза
      # v0.36.0 (22.04.2026). Метки этого действия уже подменяли: 19.03.2026 76 из
      # 77 меток trivy-action и все метки setup-trivy передвинули на коммиты,
      # воровавшие секреты джоб (GHSA-69fq-xp46-6x23). v0.36.0 вышел после разбора,
      # сам держит setup-trivy (v0.2.6) и actions/cache коммитами и ставит Trivy
      # v0.70.0 — тоже неизменяемый релиз после разбора (подложными были
      # 0.69.4–0.69.6). Версию Trivy держит коммит действия: Dependabot поднимет их
      # вместе.
      #
      # Порядок несущий: отчёт и SBOM — до гейта, чтобы артефакт был и тогда, когда
      # гейт красный; гейт — до входа в реестр: образ с исправимой critical не
      # публикуется. Бинарь и базу уязвимостей ставит первый вызов, следующие берут
      # их оттуда (`skip-setup-trivy`, `cache: false`): повторное восстановление
      # кэша затирало бы свежую базу вчерашней, и каждый вызов качал бы её заново.
      # Сканируются только уязвимости (`scanners: vuln`): секреты в файлах — забота
      # detect-secrets по репозиторию, а ложная «critical» в чужом тестовом файле
      # внутри site-packages останавливала бы выкатку.
      - name: Скан образа сервера — отчёт HIGH и CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: outreach-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: trivy-backend.txt
          exit-code: "0"

      - name: Скан образа фронта — отчёт HIGH и CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: outreach-web:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: trivy-web.txt
          exit-code: "0"
          skip-setup-trivy: true
          cache: false

      # SBOM — опись состава образа (CycloneDX): по ней отвечают на «был ли пакет X
      # в образе, выкаченном такого-то числа», не скачивая образ. Уязвимостей в
      # описи нет — только пакеты и версии.
      - name: SBOM образа сервера
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: outreach-backend:ci
          format: cyclonedx
          output: sbom-backend.cdx.json
          skip-setup-trivy: true
          cache: false

      - name: SBOM образа фронта
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: outreach-web:ci
          format: cyclonedx
          output: sbom-web.cdx.json
          skip-setup-trivy: true
          cache: false

      - name: Отчёт сканера — в лог и в сводку прогона
        run: |
          for f in trivy-backend.txt trivy-web.txt; do
            echo "== $f"
            cat "$f"
          done
          {
            echo "### Скан образов: HIGH и CRITICAL, с исправлением и без"
            for f in trivy-backend.txt trivy-web.txt; do
              printf '\n#### %s\n\n~~~\n' "$f"
              cat "$f"
              printf '~~~\n'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # 90 дней: опись нужна, пока выкаченный образ может стоять на сервере.
      - name: SBOM и отчёт сканера — в артефакт
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-sbom
          path: |
            sbom-backend.cdx.json
            sbom-web.cdx.json
            trivy-backend.txt
            trivy-web.txt
          if-no-files-found: error
          retention-days: 90

      # Гейт: исправимая critical роняет джобу, и образ не публикуется. HIGH — в
      # отчёте выше, но не роняет: база уязвимостей обновляется каждые несколько
      # часов, и порог по HIGH краснил бы main чужими публикациями, а не правкой, —
      # с остановкой выкатки: публикацию держит эта же джоба. Без исправления
      # (`ignore-unfixed`) тоже не роняет: чинить нечем, кроме смены базового
      # образа. Исключение — строкой в .trivyignore: id, срок `exp:` и причина.
      - name: Гейт образа сервера — исправимые CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: outreach-backend:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true
          cache: false

      - name: Гейт образа фронта — исправимые CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: outreach-web:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true
          cache: false

      - name: Войти в реестр
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Опубликовать образы
        # Только со слитого в main: образ из ветки, которую никто
        # не принял, на сервере не нужен, а метка `main` обязана
        # означать то, что в main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Имя владельца — строчными: реестр другого не принимает,
          # а `github.repository_owner` отдаёт его как записан в профиле.
          # Шаг не выполняется на ветках (образ непринятой работы
          # в реестре не нужен), поэтому сломался при первом же слиянии
          # в main — проверить его на PR было нечем.
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/$owner/outreach-donors"
          for pair in "backend:$repo-backend" "web:$repo-web"; do
            local_image="outreach-${pair%%:*}:ci"
            remote="${pair#*:}"
            docker tag "$local_image" "$remote:${{ github.sha }}"
            docker tag "$local_image" "$remote:main"
            docker push "$remote:${{ github.sha }}"
            docker push "$remote:main"
          done
