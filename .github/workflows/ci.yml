name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Тесты репозитория идут на настоящей базе: проверять запрос к базе
    # на подделке значит проверять подделку.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_STORAGE_DSN: postgresql+asyncpg://outreach:outreach@localhost:5432/outreach_test

    steps:
      # Полная история: проверке волн нужна база PR и общий предок с ней —
      # на глубине 1 `base...HEAD` не считается.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv той же версии, что ставит зависимости в образ (`Dockerfile`,
      # `FROM ghcr.io/astral-sh/uv:… AS uv`): lock-файл сверяется и ставится
      # одним инструментом. Совпадение держит tests/test_python_lock.py.
      # Действие закреплено коммитом: метку можно передвинуть, коммит — нет.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"

      # Отдельным шагом, чтобы красное называлось причиной. Правка
      # pyproject.toml без `uv lock` иначе разошлась бы с lock-файлом молча:
      # тесты шли бы на старых версиях, а новый диапазон не проверял никто.
      - name: Lock-файл совпадает с pyproject
        run: uv lock --check

      # Ровно версии из uv.lock — те же, что уедут в образ. Раньше здесь
      # стоял `pip install` по диапазонам, и 25.09.2026 CI покраснел не от
      # правки, а от чужого релиза: сам поставил только что вышедшую
      # SQLAlchemy 2.1.0. `.venv/bin` в PATH — чтобы шаги ниже звали ruff,
      # mypy и pytest оттуда.
      - name: Установить зависимости
        run: |
          uv sync --frozen --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Линтер
        run: ruff check backend/ tests/ scripts/

      - name: Форматирование
        run: ruff format --check backend/ tests/ scripts/

      - name: Типы
        run: mypy backend/

      # На PR гейт читает и сообщения коммитов PR (`--commits`): они уходят в
      # публичную историю так же, как файлы, а после слияния их не переписать.
      # База — ветка назначения, как у проверки волн ниже. На push в main
      # сообщения уже опубликованы — судить их поздно, гейт идёт по файлам.
      - name: Архитектурные гейты
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            python scripts/gates.py --commits "origin/$GITHUB_BASE_REF"
          else
            python scripts/gates.py
          fi

      # §3.4a. Необратимое без человека в цепочке требует подписи оператора.
      # Сверяется ИСПОЛНЕНИЕМ: подпись, которую никто не проверил, неотличима
      # от подделанной. Шаг обязан жить в CI, а не только в хуке: локальную
      # проверку агент обходит флагом, серверную — нет.
      - name: Подпись необратимого
        run: bash scripts/check_irreversible_signature.sh

      # Волны контура модуля «Продажи»: срез продаж с пропущенной волной не уходит
      # в main. Шаг здесь, потому что мерж держит только обязательная проверка:
      # `quality` не обязательна, а merge_guard обходится через `gh pr merge`.
      # Без файлов sales/ шаг зелёный и говорит это словами; PR доноров не краснит.
      # На pre-push та же проверка — только предупреждение (scripts/hooks/pre-push).
      #
      # База диффа — лестница шага «Diff base» из quality.yml без тихой ступени:
      # PR — ветка назначения; push в main — состояние до толчка; нулевой или
      # недостижимый `before` — отказ вслух. Фолбэк на HEAD дал бы пустой дифф и
      # зелёное «проверено» над пустотой (урок cqg@2.34).
      - name: Волны контура модуля «Продажи»
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            echo "::error::база диффа не определима (before=${BEFORE:-пусто}): первый push или переписанная история — проверка волн не судит пустоту"
            exit 1
          fi
          echo "база диффа: $base"
          python scripts/contour_waves.py --base "$base"

      - name: Ратчет сложности
        run: python scripts/complexity.py

      # Сьют в обязательной проверке идёт ГОЛЫМ. Покрытие с `concurrency =
      # greenlet` (без него coverage слеп к async-коду, а ядро sysmon гринлеты не
      # держит) стоило ей +200–290 с на каждом backend-PR: «Тесты» 530/532/561/608 с
      # без покрытия против 801/822 с с ним (замер 07.10, #180/#194/#196). При
      # `strict` и слиянии по одному это минуты на каждый PR очереди. Покрытие —
      # в джобе `coverage` ниже, параллельно и необязательно.
      - name: Тесты
        run: pytest

  # Покрытие изменённого кода — отдельной необязательной джобой, ПАРАЛЛЕЛЬНО
  # check: обязательный путь не ждёт трассировку. Сьют на backend-PR идёт дважды —
  # это место в очереди раннеров, а не деньги (репозиторий публичный), и скорость
  # слияний важнее (решение 07.10). Нет правок python в backend — сьют здесь не
  # гоняется, джоба кладёт только привязку `coverage.json.head`.
  #
  # Покрытие снимается с КАТАЛОГОВ изменённых файлов, а не с имён модулей — по
  # двум независимым причинам (#196):
  # 1. Имя модуля coverage ищет через find_spec ещё до первого теста, и тот
  #    импортирует родительский пакет: `backend.features.core.models.donor`
  #    тянет все модели и SQLAlchemy до старта трассировки, после чего процесс
  #    падает segfault на первом подключении к базе (#194: в CI 1 из 1,
  #    локально 3 из 3; каталогом — 3 из 3 зелёные). Так же — `features/sales`.
  # 2. По имени coverage не видит файл, загруженный по пути: ревизии миграций
  #    (`tests/migration_helpers.py`, spec_from_file_location) выпадали из
  #    отчёта, и гейт краснел «не исполнялся тестами вовсе».
  # Соседние файлы каталога в отчёте гейту не мешают: он судит изменённые
  # файлы целиком (`percent_covered` файла), а не строки диффа. Привязка
  # `coverage.json.head` — SHA, на котором шёл сьют: гейт откажется судить
  # отчёт чужого коммита.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_STORAGE_DSN: postgresql+asyncpg://outreach:outreach@localhost:5432/outreach_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Та же версия uv и тот же lock, что в check: покрытие снимается с того же
      # окружения, на котором check судит тесты.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"

      - name: Установить зависимости
        run: |
          uv sync --frozen --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Тесты с покрытием изменённых каталогов
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          dirs=""
          if [ -n "$base" ]; then
            dirs=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- 'backend/*.py' \
              | xargs -r -n1 dirname | sort -u)
          fi
          if [ -n "$dirs" ]; then
            echo "покрытие каталогов изменённых файлов: $(echo $dirs)"
            pytest $(printf -- '--cov=%s ' $dirs) --cov-report=json:coverage.json
          else
            echo "правок python в backend нет — сьют здесь не гоняется, судить нечего"
          fi
          git rev-parse HEAD > coverage.json.head

      - name: Отчёт покрытия для гейта
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.json
            coverage.json.head
          retention-days: 3

  # Гейт покрытия изменённого кода (контур, scripts/lint/check_diff_coverage.sh)
  # читает отчёт джобы coverage и сьют не гоняет. Как и coverage, не блокирующий:
  # обязательная проверка у проекта — check. Без базы и питона проекта — только
  # git и python3.
  diff-coverage:
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STRICT: "1"
      MIN_PCT: "70"
      LINT_PY_SRC: backend
      LINT_BE_DIR: "."
      LINT_COV_PKG: backend
      LINT_COV_FILE: coverage.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      # Лестница базы та же, что у шага волн и «Diff base» в quality.yml: PR — ветка
      # назначения; push в main — состояние до толчка; иначе отказ вслух.
      - name: Покрытие изменённого кода
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            echo "::error::база диффа не определима (before=${BEFORE:-пусто}): гейт покрытия не судит пустоту"
            exit 1
          fi
          echo "база диффа: $base"
          BASE="$base" bash scripts/lint/check_diff_coverage.sh

  # Фронт проверяется отдельной работой: он не зависит ни от базы, ни от
  # питона, и держать его в одной работе значит ждать поднятия постгреса
  # ради проверки типов в TypeScript.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Форматирование
        run: npm run format:check

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

  # Образы собираются в CI по той же причине, по которой тесты гоняются
  # там же: сломанный Dockerfile иначе обнаруживается при развёртывании,
  # когда чинить его некогда. Контейнеры здесь не запускаются — это
  # проверка сборки, а не работы.
  docker:
    runs-on: ubuntu-latest
    # Публикуется только проверенное: метка `main` — это то, что сервер
    # стянет при следующем обновлении, и образ с красными тестами уехал
    # бы на прод ровно так же, как зелёный.
    needs: [check, web]

    # Образы уезжают в реестр той же работой, что их собирает: собранный
    # и не опубликованный образ — это сборка на сервере, а она берёт
    # 2–3 ГБ памяти рядом с работающей соседней системой.
    permissions:
      contents: read
      packages: write

    # База нужна одному шагу — прогону миграций тем же образом, каким они
    # пойдут на сервере. Тесты её не используют: у них своя работа.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_fresh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Образ сервера и воркера
        run: docker build --target backend -t outreach-backend:ci .

      - name: Образ фронта
        run: docker build --target web -t outreach-web:ci .

      - name: Консольная команда внутри образа находит свой код
        # Ловит ровно тот дефект, который нашёлся живым запуском 19.09.2026:
        # пустышка пакета в site-packages перекрывала настоящий код, и
        # `outreach user-add` внутри контейнера падал на импорте.
        run: docker run --rm outreach-backend:ci outreach --help

      - name: Шаблоны писем и промпты — внутри образа
        # 29.09.2026 колесо проекта ушло в образ без не-питоновых файлов,
        # и консольная команда (`outreach mail-test`, `letters-build`) не
        # находила шаблона письма. Сервер и воркеры этого не видели: они
        # запускаются из /app и берут код оттуда, а консоль — из
        # site-packages. Поэтому проверка идёт из чужого каталога и сначала
        # убеждается, что читает установленную копию: из /app она прошла бы
        # и на сломанном образе.
        run: |
          docker run --rm -i -w /tmp outreach-backend:ci python - <<'EOF'
          import backend
          assert "site-packages" in backend.__file__, backend.__file__
          from backend.features.core.domain import Stage
          from backend.features.keywords import angles
          from backend.features.letters import template
          for stage in Stage:
              template.for_stage(stage)
              for step in (1, 2):
                  template.followup(step, stage)
          for name in ("guides", "news", "reviews", "topics"):
              angles.load_prompt(name)
          from backend.features.agent import writer
          writer.load_prompt()
          # Судья, переписывание и разбор ответа читают промпт при импорте:
          # без файла в колесе падает уже импорт.
          from backend.features.donors import publisher_judge
          from backend.features.letters import rewrite
          from backend.features.replies import extract
          for prompt in (publisher_judge.SYSTEM, publisher_judge.ARBITER_SYSTEM, rewrite.SYSTEM, extract.SYSTEM):
              assert prompt, "пустой промпт"
          print("шаблоны писем и промпты читаются из", backend.__file__)
          EOF

      - name: Миграции на чистой базе — тем же образом, что и на сервере
        # Набор тестов гоняет alembic из рабочей копии; на сервере его
        # гоняет контейнер `migrate` из образа. Разница между ними —
        # это ровно то, что ломает первое развёртывание: не уехавший
        # в образ файл миграции или недостающая зависимость.
        run: |
          docker run --rm --network host \
            -e STORAGE_DSN="postgresql+asyncpg://outreach:outreach@127.0.0.1:5432/outreach_fresh" \
            outreach-backend:ci alembic upgrade head

      - name: Войти в реестр
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Опубликовать образы
        # Только со слитого в main: образ из ветки, которую никто
        # не принял, на сервере не нужен, а метка `main` обязана
        # означать то, что в main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Имя владельца — строчными: реестр другого не принимает,
          # а `github.repository_owner` отдаёт его как записан в профиле.
          # Шаг не выполняется на ветках (образ непринятой работы
          # в реестре не нужен), поэтому сломался при первом же слиянии
          # в main — проверить его на PR было нечем.
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/$owner/outreach-donors"
          for pair in "backend:$repo-backend" "web:$repo-web"; do
            local_image="outreach-${pair%%:*}:ci"
            remote="${pair#*:}"
            docker tag "$local_image" "$remote:${{ github.sha }}"
            docker tag "$local_image" "$remote:main"
            docker push "$remote:${{ github.sha }}"
            docker push "$remote:main"
          done
