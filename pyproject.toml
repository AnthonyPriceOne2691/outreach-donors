[project]
name = "outreach-donors"
version = "0.1.0"
description = "Поиск доноров по выдаче и аутрич: база доноров с ценами"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "redis>=5.2",
    "rq>=1.16",
    # Разбор HTML: контактные страницы в Ф4, тело статьи в Ф7.
    "selectolax>=0.3",
    # Импорт списков из выгрузок Excel — кодировка приедет какая угодно.
    "chardet>=5.2",
    # Корневой домен по списку публичных суффиксов: без него someone.wordpress.com
    # и user.github.io схлопнулись бы в чужие домены.
    "tldextract>=5.1",
    # Запись MX: ступень 0 лестницы контактов. В стандартной библиотеке
    # запроса к DNS нет, а без него мы бы писали на домены, которые почту
    # не принимают, и жгли репутацию отправителя отказами доставки.
    "dnspython>=2.7",
    "bcrypt>=4.2",
    "PyJWT>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "greenlet>=3.1",
    "pre-commit>=4.0",
]

[project.scripts]
outreach = "backend.cli.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]
extend-exclude = ["migrations", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","C4","C90","SIM","RUF","ASYNC","S","PT","RET","PIE","PL","TRY400","BLE001","ARG","DTZ"]
ignore = [
    "E501",                 # длину разрулит форматтер
    "S101",                 # assert разрешён
    "S104",                 # bind 0.0.0.0 — в контейнере норма
    "PLR2004",              # magic-value — шумно
    "B008",                 # DI-объект как default аргумента (FastAPI Depends)
    "RUF001","RUF002","RUF003",  # комментарии проекта по-русски
]
per-file-ignores = { "tests/**/*.py" = ["S","PLR2004","PLR0915","PLR0912","C901","B017","PT011","PT012","N806","N803","E402","DTZ","ARG"] }

# Пороги на уровне функции: плохой код живёт в функциях, а не в файлах.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
packages = ["backend"]
exclude = ["migrations/", "tests/", ".venv/", "venv/"]
# Без плагина pydantic mypy считает поля с Field(default, ...) обязательными
# аргументами конструктора и краснеет на каждом Settings().
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
# Каждое предупреждение = падение теста. Исключения — поштучно и с причиной.
filterwarnings = ["error"]
