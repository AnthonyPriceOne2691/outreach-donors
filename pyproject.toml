[project]
name = "outreach-donors"
version = "0.1.0"
description = "Поиск доноров по выдаче и аутрич: база доноров с ценами"
requires-python = ">=3.12"
# Здесь диапазоны — что проект допускает. Что именно стоит в CI, в образе
# и после `uv sync` на машине, записано в uv.lock. Правка списков ниже
# без `uv lock` роняет CI отдельным шагом; как добавить и обновить —
# README, раздел «Зависимости».
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Потолок до 2.1 — осознанно. 25.09.2026 CI поставил вышедшую 2.1.0,
    # и mypy упал на двадцати местах чужих файлов (у `Select` другие
    # параметры типа). Версию теперь держит uv.lock, но потолок нужен
    # и ему: `uv lock --upgrade` поднимает всё в пределах диапазонов,
    # и без потолка 2.1 приехала бы попутно, с обновлением чего-то другого.
    # Переход — отдельной работой: правка типов и полный набор тестов
    # на новой версии.
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "redis>=5.2",
    # 2.8 — первая версия с `unique`: с ней постановка разбора ответа идемпотентна
    # (`api/inbound/routes._queue_parse`), а на старой флаг ушёл бы доводом
    # в саму задачу и ронял бы её.
    "rq>=2.8",
    # Разбор multipart/form-data: почтовая платформа шлёт входящее письмо
    # именно им (Inbound Parse), а в Starlette разбора форм нет без этой
    # библиотеки — запрос падает на первом же письме с вложением.
    "python-multipart>=0.0.20",
    # Разбор HTML: контактные страницы в Ф4, тело статьи в Ф7.
    # Потолок до 1.0 — осознанно: в 1.0 модуль `selectolax.parser` (движок
    # Modest) при импорте бросает ImportError и отсылает к `selectolax.lexbor`,
    # а им разбирают страницы восемь модулей — от контактов до признаков
    # продажи на главной (`donors/home_signals.py`). `uv lock --upgrade` поднял
    # бы 1.0 попутно. Переход на lexbor — отдельной работой: другой разбор,
    # и сверка извлечения на живых страницах.
    "selectolax>=0.3,<1",
    # Импорт списков из выгрузок Excel — кодировка приедет какая угодно.
    "chardet>=5.2",
    # Корневой домен по списку публичных суффиксов: без него someone.wordpress.com
    # и user.github.io схлопнулись бы в чужие домены.
    "tldextract>=5.1",
    # Запись MX: ступень 0 лестницы контактов. В стандартной библиотеке
    # запроса к DNS нет, а без него мы бы писали на домены, которые почту
    # не принимают, и жгли репутацию отправителя отказами доставки.
    "dnspython>=2.7",
    "bcrypt>=4.2",
    # Проверка подписи событий доставки: платформа подписывает вебхук
    # ECDSA, и без проверки эту ручку может дёрнуть кто угодно — а она
    # паркует домены рассылки и пишет в стоп-лист.
    "cryptography>=44",
    "PyJWT>=2.10",
]

[project.optional-dependencies]
# Ступень браузера: нужна только для сайтов, которые закрылись от обычного
# запроса или рисуют адрес скриптом. Не в основных зависимостях намеренно —
# это сотни мегабайт хромиума ради каждого шестого домена.
browser = ["playwright>=1.47"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "greenlet>=3.1",
    "pre-commit>=4.0",
    # Тест «бэкап покрывает состояние» читает docker-compose.yml: список
    # томов берётся из компоуза, а не переписывается в тест.
    "pyyaml>=6.0",
    # Гейт слоёв контура берёт lint-imports из venv проекта. Без него
    # подхватывался чужой бинарь (Homebrew) со своим питоном, для которого
    # пакета `backend` нет, — и локальный коммит краснел ложным «нарушено».
    "import-linter>=2.0",
]

[project.scripts]
outreach = "backend.cli.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

# Не-питоновые файлы пакета. Образ ставит проект колесом (`uv sync
# --no-editable`, Dockerfile), а колесо без этого списка уходит с одними `.py`:
# 29.09.2026 в установленном пакете на проде не нашлось ни одного шаблона
# письма и ни одного промпта ключей. Сервер и воркеры берут код из /app и этого
# не видели, а консоль берёт его из site-packages: она не собрала бы ни одного
# письма, и пробное письмо (`outreach mail-test`) не ушло. Новый такой файл обязан попасть
# сюда: иначе упадёт `tests/test_package_data.py`, а образ проверит шаг CI
# «Шаблоны писем и промпты — внутри образа».
[tool.setuptools.package-data]
"backend.features.letters" = ["templates/*.txt", "prompts/*.md"]
"backend.features.keywords" = ["prompts/*.md"]
"backend.features.agent" = ["prompts/*.md"]
"backend.features.donors" = ["prompts/*.md"]
"backend.features.replies" = ["prompts/*.md"]
"backend.features.sales" = ["prompts/*.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]
extend-exclude = [
    "migrations", ".venv", "venv", "__pycache__",
    # Механика контура — НАШ репозиторий, ЧУЖОЕ авторство (CQG §6, третий
    # принцип). Она приезжает перевендориванием и чинится не здесь: правка,
    # сделанная линтером проекта, разойдётся со снимком канона, и доктор
    # объявит адаптацию, которой не делали. Замер 30.09: ruff проекта дал 100
    # ошибок в 26 файлах payload при нуле в легаси проекта.
    "scripts/lint", "scripts/delivery_*.py", "scripts/okf_*.py",
    "scripts/merge_guard.sh", "extract_payload.py", "docs/canon",
]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","C4","C90","SIM","RUF","ASYNC","S","PT","RET","PIE","PL","TRY400","BLE001","ARG","DTZ"]
ignore = [
    "E501",                 # длину разрулит форматтер
    "S101",                 # assert разрешён
    "S104",                 # bind 0.0.0.0 — в контейнере норма
    "PLR2004",              # magic-value — шумно
    "B008",                 # DI-объект как default аргумента (FastAPI Depends)
    "RUF001","RUF002","RUF003",  # комментарии проекта по-русски
]
per-file-ignores = { "tests/**/*.py" = ["S","PLR2004","PLR0915","PLR0912","C901","B017","PT011","PT012","N806","N803","E402","DTZ","ARG"] }

# Пороги на уровне функции: плохой код живёт в функциях, а не в файлах.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
packages = ["backend"]
exclude = ["migrations/", "tests/", ".venv/", "venv/"]
# Без плагина pydantic mypy считает поля с Field(default, ...) обязательными
# аргументами конструктора и краснеет на каждом Settings().
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
# Каждое предупреждение = падение теста. Исключения — поштучно и с причиной.
filterwarnings = ["error"]

[tool.coverage.run]
# Асинхронный SQLAlchemy продолжает корутины в гринлетах, и без этой строки
# coverage не видит ни одной строки после первого `await session…`: маршрут,
# который тесты проходят целиком, записывался в непокрытые (гейт покрытия
# изменённых файлов на #160 — 61% у маршрутов лидов с тестами на каждую ветку).
concurrency = ["greenlet", "thread"]
