# Боевые отличия. Накладывается поверх основного файла:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Что здесь и почему:
#
# **Лимиты памяти и процессора у каждого сервиса.** На машине живут два
# проекта, и у соседа лимитов нет ни одного. Без них плохой день задачи
# №2 — сборка очереди писем на двухстах донорах или браузерная ступень
# поиска контактов — съедает память и роняет соседа, а выглядит это как
# «сервер кейсов почему-то перезапустился». Числа взяты с запасом
# от замеров на стенде и подлежат пересчёту после первого `docker stats`
# под нагрузкой: это оценка, а не измерение.
#
# **Наружу не смотрит никто.** Фронт слушает только петлю, а 80 и 443
# держит обратный прокси хоста, общий с соседом (`deploy/README.md`).
# Порт наружу здесь означал бы сервис без TLS и мимо общего сертификата.
#
# **Перезапуск всегда.** `unless-stopped` уже стоит в основном файле;
# здесь добавлены политики перезапуска задач и потолок логов: журнал
# json-file без ротации однажды съедает диск, и происходит это на той
# же машине, где лежит база.

services:
  postgres:
    # Буферы против умолчания в 128 МБ: база доноров с метриками —
    # главный актив, и её чтение идёт постоянно. Верхняя граница мала
    # намеренно: 32 ГБ делятся с соседом и с воркерами.
    command: >-
      postgres -c shared_buffers=1GB -c effective_cache_size=3GB
      -c max_connections=60 -c work_mem=16MB
    mem_limit: 4g
    cpus: 2.0
    logging: &logs
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    # Очередь, а не хранилище: при переполнении выбрасываем старое, но
    # не даём отъесть память у базы. Задачи пересобираются прогоном.
    command: redis-server --maxmemory 384mb --maxmemory-policy allkeys-lru
    mem_limit: 512m
    cpus: 0.5
    logging: *logs

  migrate:
    mem_limit: 512m
    cpus: 1.0
    logging: *logs

  api:
    mem_limit: 1g
    cpus: 2.0
    logging: *logs

  # Воркеру достаётся больше всех: он собирает письма (вызовы модели),
  # ходит за выдачей и метриками и поднимает браузер на ступени поиска
  # контактов. Chromium — единственная часть сервиса, которая может
  # съесть гигабайт за минуту.
  worker:
    mem_limit: 3g
    cpus: 3.0
    logging: *logs

  reaper:
    mem_limit: 256m
    cpus: 0.5
    logging: *logs

  followups:
    mem_limit: 256m
    cpus: 0.5
    logging: *logs

  web:
    ports: !override
      # Только петля: наружу смотрит обратный прокси хоста, он же держит
      # сертификат на оба поддомена.
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    mem_limit: 256m
    cpus: 0.5
    logging: *logs
