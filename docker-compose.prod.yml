# Боевые отличия. Накладывается поверх основного файла:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Что здесь и почему:
#
# **Лимиты памяти и процессора у каждого сервиса.** На машине живут два
# проекта, и у соседа лимитов нет ни одного. Без них плохой день задачи
# №2 — сборка очереди писем на двухстах донорах или браузерная ступень
# поиска контактов — съедает память и роняет соседа, а выглядит это как
# «соседняя система почему-то перезапустилась». Числа взяты с запасом
# от замеров на стенде и подлежат пересчёту после первого `docker stats`
# под нагрузкой: это оценка, а не измерение.
#
# **Наружу не смотрит никто.** Фронт слушает только петлю, а 80 и 443
# держит обратный прокси хоста, общий с соседом (`deploy/README.md`).
# Порт наружу здесь означал бы сервис без TLS и мимо общего сертификата.
#
# **Перезапуск всегда.** `unless-stopped` уже стоит в основном файле;
# здесь добавлены политики перезапуска задач и потолок логов: журнал
# json-file без ротации однажды съедает диск, и происходит это на той
# же машине, где лежит база.

services:
  postgres:
    # Буферы против умолчания в 128 МБ: база доноров с метриками —
    # главный актив, и её чтение идёт постоянно. Верхняя граница мала
    # намеренно: 32 ГБ делятся с соседом и с воркерами.
    # Соединений 150 (29.10.2026, было 100 при восьми обходчиках): у шестнадцати
    # обходчиков до трёх у каждого (`crawl_jobs.POOL_SIZE` 2 + 1) — 48; у API пул до
    # 15; у пяти воркеров очередей, reaper и followups — по своей задаче, обычно по
    # 1–3, в худший день до 15 у одного; migrate при выкатке и три служебных. Обычный
    # счёт — около 90, при сотне это впритык. Соединение — свой процесс Postgres,
    # 2–5 МБ в простое: 150 — меньше гигабайта поверх `shared_buffers`, `mem_limit`
    # держит с запасом. Смена команды пересоздаёт контейнер базы — выкатывать, когда
    # обходы и очереди не идут.
    command: >-
      postgres -c shared_buffers=1GB -c effective_cache_size=3GB
      -c max_connections=150 -c work_mem=16MB
    mem_limit: 4g
    cpus: 2.0
    logging: &logs
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    # Потолок памяти, чтобы очередь не отъела её у базы. При переполнении
    # — отказ новой записи, а не выброс старой: `allkeys-lru` молча
    # выбрасывал бы поставленные задачи (прогон, разбор ответа), и они
    # не выполнились бы никогда. Отказ громкий — его видно в журнале.
    command: redis-server --maxmemory 384mb --maxmemory-policy noeviction
    mem_limit: 512m
    cpus: 0.5
    logging: *logs

  migrate:
    mem_limit: 512m
    cpus: 1.0
    logging: *logs

  api:
    mem_limit: 1g
    cpus: 2.0
    logging: *logs

  # Воркеру достаётся больше всех: он собирает письма (вызовы модели),
  # ходит за выдачей и метриками и поднимает браузер на ступени поиска
  # контактов. Chromium — единственная часть сервиса, которая может
  # съесть гигабайт за минуту.
  worker:
    mem_limit: 3g
    cpus: 3.0
    logging: *logs

  # Воркер ответов продаж: один процесс, вызов модели на ответ. Лимиты — как
  # у копии обходчика: оценка до первого `docker stats`, не замер.
  worker-sales:
    mem_limit: 1536m
    cpus: 1.0
    logging: *logs

  # Долгие задачи продаж: пачка, сборка, сбор базы, очистка — по одной за раз. Лимиты —
  # как у воркера ответов: оценка до первого `docker stats`, не замер.
  worker-sales-bulk:
    mem_limit: 1536m
    cpus: 1.0
    logging: *logs

  # Короткие задачи и поиск адресов — по одному процессу; лимиты — как у воркеров продаж:
  # оценка до первого `docker stats`, не замер.
  worker-quick:
    mem_limit: 1536m
    cpus: 1.0
    logging: *logs

  worker-contacts:
    mem_limit: 1536m
    cpus: 1.0
    logging: *logs

  # На копию обходчика — один донор: страницы в памяти по одной, ссылки
  # уходят пачками. Полтора гигабайта — с запасом под браузер, если его
  # включат (`CRAWL_BROWSER_ENABLED`). Копий шестнадцать (`CRAWL_WORKERS`):
  # по ядру на копию было бы вся машина в 16 ядер, где живут и база, и сосед.
  # Обход ждёт сайт — паузу не меньше секунды между страницами и сам ответ, —
  # а не считает: разбор страницы — доли секунды. Поэтому три четверти ядра:
  # обычному обходу их хватает с запасом, а шестнадцать разом в худшем случае
  # берут 12 ядер из 16, а не все. Включат браузер — вернуть 1.0 и смотреть
  # `docker stats`: Chromium на трёх четвертях ядра рисует страницу медленнее.
  # Память — 24 ГБ на все копии из 61. Новый обход копия берёт, только если на
  # машине есть свободные ядра под него (`workers/load_gate.py`, `CRAWL_GATE_*`).
  crawler:
    mem_limit: 1536m
    cpus: 0.75
    logging: *logs

  reaper:
    mem_limit: 256m
    cpus: 0.5
    logging: *logs

  followups:
    mem_limit: 256m
    cpus: 0.5
    logging: *logs

  web:
    ports: !override
      # Только петля: наружу смотрит обратный прокси хоста, он же держит
      # сертификат на оба поддомена.
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    mem_limit: 256m
    cpus: 0.5
    logging: *logs
