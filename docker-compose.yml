# Весь стек в докере: фронт, сервер, воркер, очередь, база.
#
# Отличия от `docker-compose.dev.yml` — не косметика, а разные решения:
#   • исходники не монтируются: образ и есть то, что работает;
#   • фронт — собранные файлы под nginx, а не dev-сервер;
#   • сервер без `--reload`;
#   • база и очередь наружу не опубликованы: к ним ходят только из сети
#     докера. Нужен доступ снаружи для разработки — для этого есть
#     дев-компоуз, который поднимает их отдельно на 5442 и 6389;
#   • **ни одного значения секрета в этом файле** — он едет в git.
#     Запись `${VAR:?...}` означает: нет переменной — компоуз не стартует
#     и называет, чего не хватает, вместо тихого запуска с пустотой.
#
# Песочница выдачи включена по умолчанию нарочно: живой ключ тратит
# деньги, и переключение в боевой режим — решение человека, а не
# следствие того, что сервис уехал на сервер.
#
# **У каждого сервиса есть имя образа.** Локально его даёт сборка,
# на сервере — реестр: `BACKEND_IMAGE` и `WEB_IMAGE` подставляют образ
# из ghcr.io, и тогда `docker compose pull` заменяет сборку. Сборка
# фронта берёт 2–3 ГБ памяти, а рядом работает соседняя система —
# собирать на сервере значит однажды уронить её.
#
# Боевые отличия — лимиты памяти, отсутствие портов наружу и прочее —
# в `docker-compose.prod.yml`, который накладывается сверху.
name: outreach-donors

# **Весь `.env` доходит до контейнеров.** Список ниже — не перечень того,
# что передаётся, а то, что задаётся поверх: адреса базы и очереди внутри
# сети докера и безопасные умолчания. Раньше контейнер получал ТОЛЬКО
# этот список, и ключ почтовой платформы, режим судья и прочее, чего
# в списке не было, не доезжали никогда — включить почту на сервере
# одним `.env` было нельзя.
x-backend-env-file: &backend-env-file
  - path: .env
    required: false

x-backend-env: &backend-env
  # Адрес владельца схемы. Им идут миграции и выдача прав (`migrate`); сервисы с паролем
  # роли приложения ходят ею — те же хост и база, свои имя и пароль (`config/storage.py`,
  # аудит 20.11.2026). Пароль пуст — сервисы ходят владельцем, как раньше.
  STORAGE_DSN: "postgresql+asyncpg://outreach:${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD}@postgres:5432/outreach"
  POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
  STORAGE_REDIS_URL: "redis://redis:6379/0"
  ACCESS_JWT_SECRET: "${ACCESS_JWT_SECRET:?нужен ACCESS_JWT_SECRET — без него вход не работает; сгенерировать командой openssl rand -hex 32}"
  ACCESS_TOKEN_TTL_HOURS: ${ACCESS_TOKEN_TTL_HOURS:-24}
  ACCESS_LOGIN_ATTEMPTS_PER_MINUTE: ${ACCESS_LOGIN_ATTEMPTS_PER_MINUTE:-10}
  AHREFS_API_KEY: ${AHREFS_API_KEY:-}
  SERP_PROVIDER: ${SERP_PROVIDER:-dataforseo}
  SERP_LOGIN: ${SERP_LOGIN:-}
  SERP_PASSWORD: ${SERP_PASSWORD:-}
  SERP_SANDBOX: ${SERP_SANDBOX:-true}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_LETTERS_MODEL: ${LLM_LETTERS_MODEL:-gpt-5}
  CONTACTS_HUNTER_API_KEY: ${CONTACTS_HUNTER_API_KEY:-}
  # Умолчание `null` намеренно: транспорт, который ничего не шлёт,
  # безопаснее забытой настройки, которая шлёт по-настоящему.
  OUTREACH_TRANSPORT: ${OUTREACH_TRANSPORT:-null}
  OUTREACH_INBOUND_SECRET: ${OUTREACH_INBOUND_SECRET:-}
  OUTREACH_SENDER_NAME: ${OUTREACH_SENDER_NAME:-}
  OUTREACH_POSTAL_ADDRESS: ${OUTREACH_POSTAL_ADDRESS:-}
  OUTREACH_UNSUBSCRIBE_URL: ${OUTREACH_UNSUBSCRIBE_URL:-}
  OUTREACH_PRICE_CONFIDENCE: ${OUTREACH_PRICE_CONFIDENCE:-0.80}
  LOG_FORMAT: ${LOG_FORMAT:-json}

# **Права контейнеров (аудит 20.11.2026).** `no-new-privileges` — у всех: процесс
# не получает прав больше, чем у него было на старте, ни через setuid-файл, ни через
# capabilities файла. Сервисы из образа сервера работают от `app` (Dockerfile,
# `USER app`), и прав ядра им не нужно вовсе: `cap_drop: [ALL]` снимает и те, что докер
# даёт по умолчанию, — в том числе root'у, зашедшему через `exec -u root`. postgres,
# redis и web стартуют от root и сами сбрасывают права (su-exec, рабочие процессы
# nginx): им — тоже `cap_drop: [ALL]` и ровно то, без чего они не встают (у каждого
# своё; проверено живым запуском на новом и на прежнем томе 20.11.2026).
# Права, сети и образы сервисов сверяет `tests/test_deploy_hardening.py`.
x-no-new-privileges: &no-new-privileges
  - no-new-privileges:true

x-backend-hardening: &backend-hardening
  security_opt: *no-new-privileges
  cap_drop: [ALL]
  networks: [default, data]

services:
  # Образы базы и очереди — тегом и дайджестом индекса: тег для человека, дайджест для
  # докера (как базы в Dockerfile). Новый дайджест — новый образ, и `up -d` пересоздаёт
  # контейнер базы: поднимать, когда обходы и очереди не идут.
  postgres:
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    restart: unless-stopped
    security_opt: *no-new-privileges
    # Скрипт входа от root поправляет владельца и права каталога данных и сокета
    # (CHOWN, DAC_OVERRIDE, FOWNER) и переходит на пользователя postgres (SETUID, SETGID).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    networks: [data]
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD}
      POSTGRES_DB: outreach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    security_opt: *no-new-privileges
    # Скрипт входа от root отдаёт /data пользователю redis (CHOWN) и переходит на него
    # (SETUID, SETGID).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    networks: [data]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Миграции отдельным одноразовым сервисом, а не командой на старте
  # сервера: при двух серверах они бы поехали одновременно, и цепочка
  # применялась бы дважды. Остальные ждут, пока этот завершится успехом.
  #
  # Вторым шагом — роль приложения и её права (аудит 20.11.2026): роль живёт
  # в кластере, а не в цепочке ревизий, и права держатся заново при каждой
  # выкатке и после восстановления копии (`scripts/restore.sh` зовёт этот же
  # сервис). Пароль роли пуст — шаг говорит это и ничего не трогает.
  migrate:
    image: ${BACKEND_IMAGE:-outreach-backend:local}
    <<: *backend-hardening
    build:
      context: .
      target: backend
    command: ["sh", "-c", "alembic upgrade head && python -m backend.shared.database.app_role"]
    env_file: *backend-env-file
    environment: *backend-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${BACKEND_IMAGE:-outreach-backend:local}
    <<: *backend-hardening
    build:
      context: .
      target: backend
    env_file: *backend-env-file
    environment: *backend-env
    restart: unless-stopped
    # Выкатка не обрывает начатые запросы: сервер дописывает их до 25 с
    # (`--timeout-graceful-shutdown` в Dockerfile), докер ждёт 30 — умолчание
    # в 10 с убивало процесс посреди долгого запроса.
    stop_grace_period: 30s
    healthcheck:
      # Проверка ходит в базу: сервер, отвечающий «жив» с недоступной
      # базой, заставляет контейнер принимать запросы, каждый из которых
      # падает.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${BACKEND_IMAGE:-outreach-backend:local}
    <<: *backend-hardening
    build:
      context: .
      target: backend
    command: python -m backend.workers.main
    env_file: *backend-env-file
    environment: *backend-env
    restart: unless-stopped
    # Воркер опознаётся в очереди по имени хоста контейнера: зарегистрирован
    # и свежий признак жизни у rq — значит, берёт задачи.
    healthcheck:
      test: ["CMD", "python", "-m", "backend.workers.health", "worker"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Ответы продаж — своей очередью (`sales`) и своим воркером: в общей очереди
  # ответ лида ждал бы часовой прогон доноров. Один процесс; планировщик — на
  # свою очередь (повторы задачи ответа с паузой).
  worker-sales:
    image: ${BACKEND_IMAGE:-outreach-backend:local}
    <<: *backend-hardening
    build:
      context: .
      target: backend
    command: python -m backend.workers.main --queue sales
    env_file: *backend-env-file
    environment: *backend-env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "backend.workers.health", "sales"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Долгие задачи продаж — своей очередью (`sales-bulk`) и своим процессом: пачка
  # писем, сборка очереди и автосборка, сбор базы, очистка. В очереди ответов они
  # держали бы разбор ответа лида и черновик агента за собой — сбор базы идёт до
  # получаса (решение Anthony 13.10.2026). Вторая копия `worker-sales` не помогла
  # бы: две долгие задачи заняли бы обе, а частота к Kommo удвоилась бы.
  worker-sales-bulk:
    image: ${BACKEND_IMAGE:-outreach-backend:local}
    <<: *backend-hardening
    build:
      context: .
      target: backend
    command: python -m backend.workers.main --queue sales-bulk
    env_file: *backend-env-file
    environment: *backend-env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "backend.workers.health", "sales-bulk"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Короткие задачи, которых ждёт человек, — своей очередью (`quick`) и своим процессом:
  # разбор ответа донора, черновик агента, передача лида, пересчёт кандидатов после
  # обхода. В общей очереди они стояли за прогоном доноров и поиском адресов до часа
  # (разбор скорости 14.10.2026). Планировщик — на свою очередь: отложенный разбор.
  worker-quick:
    image: ${BACKEND_IMAGE:-outreach-backend:local}
    <<: *backend-hardening
    build:
      context: .
      target: backend
    command: python -m backend.workers.main --queue quick
    env_file: *backend-env-file
    environment: *backend-env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "backend.workers.health", "quick"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Поиск адресов — своей очередью (`contacts`) и одним процессом: тысяча доменов
  # рекламодателей держала бы прогоны и письма за собой, а вторая копия прошла бы
  # одни и те же домены дважды — строки очереди адресов ничем не заняты.
  worker-contacts:
    image: ${BACKEND_IMAGE:-outreach-backend:local}
    <<: *backend-hardening
    build:
      context: .
      target: backend
    command: python -m backend.workers.main --queue contacts
    env_file: *backend-env-file
    environment: *backend-env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "backend.workers.health", "contacts"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Обходы Этапа 2 — своей очередью (`crawl`) и своим сервисом: обход донора идёт
  # до часа, и в общей очереди он занял бы единственный воркер. Сколько доноров
  # идут разом — числом копий (`CRAWL_WORKERS`, 16 — решение Anthony 29.10.2026,
  # было 8): в каждой один воркер и одна задача, у каждой свои лимиты
  # (`docker-compose.prod.yml`). И свободными ядрами машины: следующий обход копия
  # берёт, только если под него есть место (`workers/load_gate.py`, `CRAWL_GATE_*`).
  #
  # Выкатка не обрывает обход: просьбу остановиться сервис передаёт задаче,
  # и обход дописывает пачку на границе страницы и ставит себе продолжение
  # (`workers/crawler.py`). Ждём дольше умолчания в 10 с: страница с паузой
  # сайта и браузером идёт до полуминуты.
  crawler:
    image: ${BACKEND_IMAGE:-outreach-backend:local}
    <<: *backend-hardening
    build:
      context: .
      target: backend
    command: python -m backend.workers.crawler
    env_file: *backend-env-file
    environment: *backend-env
    restart: unless-stopped
    stop_grace_period: 90s
    deploy:
      replicas: ${CRAWL_WORKERS:-16}
    healthcheck:
      test: ["CMD", "python", "-m", "backend.workers.health", "crawler"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Разбор мёртвых прогонов отдельным процессом: сервер бывает не один
  # (каждый ставил бы свою задачу тому же прогону), а воркер, который
  # и умирает, собственную смерть разобрать не может.
  reaper:
    image: ${BACKEND_IMAGE:-outreach-backend:local}
    <<: *backend-hardening
    build:
      context: .
      target: backend
    command: python -m backend.workers.reaper
    env_file: *backend-env-file
    environment: *backend-env
    restart: unless-stopped
    # Процесс жив — ещё не значит, что цикл идёт: зависшее ожидание снаружи
    # неотличимо от работы. Проверка читает отметки о жизни, которые цикл
    # оставляет на каждом круге (`workers/health.py`). Докер по ней НЕ
    # перезапускает — показывает `unhealthy` в `docker compose ps`.
    healthcheck:
      test: ["CMD", "python", "-m", "backend.workers.health", "beats"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Добивки уходят по сроку, а не по нажатию: ждать, пока кто-то откроет
  # экран, нельзя. Свой процесс, а не работа сервера или воркера очереди:
  # падение одного не должно останавливать другое.
  followups:
    image: ${BACKEND_IMAGE:-outreach-backend:local}
    <<: *backend-hardening
    build:
      context: .
      target: backend
    command: python -m backend.workers.followups
    env_file: *backend-env-file
    environment: *backend-env
    restart: unless-stopped
    # Процесс жив — ещё не значит, что цикл идёт: зависшее ожидание снаружи
    # неотличимо от работы. Проверка читает отметки о жизни, которые цикл
    # оставляет на каждом круге (`workers/health.py`). Докер по ней НЕ
    # перезапускает — показывает `unhealthy` в `docker compose ps`.
    healthcheck:
      test: ["CMD", "python", "-m", "backend.workers.health", "beats"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:-outreach-web:local}
    build:
      context: .
      target: web
    restart: unless-stopped
    # Мастер nginx — root: слушает 80 (NET_BIND_SERVICE), отдаёт каталоги кэша рабочим
    # процессам (CHOWN) и запускает их от nginx (SETUID, SETGID); прочее снято. Сети
    # данных нет: фронт ходит только к api, база и очередь ему не видны.
    security_opt: *no-new-privileges
    cap_drop: [ALL]
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    # Здоров — значит отдаёт и страницу, и API через себя. Проверка одной
    # страницы не видела бы главного отказа этого контейнера: 502 на API
    # при устаревшем адресе сервера (см. resolver в deploy/nginx.conf).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # 8080 занят соседней системой на этой же машине, 80 требует прав.
      # Только петля и здесь, а не только в боевом файле (аудит 19.11.2026):
      # `up` без `-f docker-compose.prod.yml` иначе открывал сервис всему
      # интернету по http, мимо TLS и пароля прокси, — а опубликованный
      # докером порт фаервол машины (ufw) не закрывает.
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy

# Сеть данных — без выхода наружу (`internal: true`, аудит 20.11.2026). У базы и очереди
# другой сети нет: ни им в интернет, ни к ним из сети по умолчанию, где живёт фронт.
# Сервисы из образа сервера — в обеих: к базе и очереди ходят по сети данных, к выдаче,
# метрикам, почте и модели — через сеть по умолчанию (шлюз наружу докер берёт у сети
# с выходом, внутренняя его не даёт). Сеть по умолчанию — прежняя, `<проект>_default`.
networks:
  data:
    internal: true

volumes:
  pgdata:
  redisdata:
